name: Generate Daily Puzzles

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "America/Denver"
  workflow_dispatch:
    inputs:
      offsetDays:
        description: "Days after Mountain-Time today to start generating"
        default: "0"
      days:
        description: "Number of consecutive days to generate"
        default: "4"
      force:
        description: "Overwrite existing puzzle files"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: generate-puzzles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          # vite/vite-node require Node ^20.19.0 || >=22.12.0 (see
          # package-lock.json) -- 22 avoids pinning a 20.x patch floor that
          # would itself go stale.
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache
          key: scowl-${{ hashFiles('scripts/generateWordLists.py') }}
      - run: npm ci
      - run: npm run words:generate
      - name: Generate upcoming puzzle files
        run: |
          npx vite-node scripts/generatePuzzles.ts \
            --offset-days "${{ github.event.inputs.offsetDays || '0' }}" \
            --days "${{ github.event.inputs.days || '4' }}" \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Commit new puzzle files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/puzzles/*.json
          if git diff --cached --quiet; then
            echo "No new puzzle files to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add pre-generated puzzle(s)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger deployment
        # A push made with GITHUB_TOKEN doesn't trigger deploy.yml's `on:
        # push` (GitHub suppresses workflow-triggering-workflow chains from
        # the default token to prevent infinite loops), so without this the
        # site silently keeps serving a stale build after every nightly
        # puzzle commit. workflow_dispatch is exempt from that restriction.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
