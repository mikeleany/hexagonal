<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagon Grid</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #282c34;
            margin: 0;
        }

        .hex-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 5px;
            width: 300px;
            transform: translateY(-15px);
        }

        .hex {
            width: 60px;
            height: 69px;
            background-color: #61dafb;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            position: relative;
        }

        /* Adjust positions to create a larger hexagonal structure */
        .hex:nth-child(1) { grid-column: 3; }
        .hex:nth-child(2), .hex:nth-child(3) { grid-column: 2 / span 3; }
        .hex:nth-child(4), .hex:nth-child(5), .hex:nth-child(6) { grid-column: 1 / span 3; }
        .hex:nth-child(7), .hex:nth-child(8), .hex:nth-child(9), .hex:nth-child(10) { grid-column: 1 / span 4; }
        .hex:nth-child(11), .hex:nth-child(12), .hex:nth-child(13), .hex:nth-child(14), .hex:nth-child(15) { grid-column: 1 / span 5; }
        .hex:nth-child(16), .hex:nth-child(17), .hex:nth-child(18), .hex:nth-child(19) { grid-column: 2 / span 4; }

    </style>
</head>
<body>
    <div class="hex-grid">
        <!-- 19 Hexagons -->
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
    </div>
</body>
</html>
