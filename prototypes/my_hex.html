<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagon Grid</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #282c34;
            margin: 0;
        }

        .hex-container {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            width: 240px;
            height: 280px;
            justify-content: center;
        }

        .hex-row {
            position: relative;
            display: flex;
	    height: 60px;
	    gap: 8px;
            justify-content: center;
	}

        .hex {
            width: 60px;
            height: 69px;
            background-color: #61dafb;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
    </style>
</head>
<body>
    <div class="hex-container">
        <!-- 19 Hexagons -->
	<div class="hex-row">
		<div class="hex"></div>
		<div class="hex"></div>
		<div class="hex"></div>
	</div>
	<div class="hex-row">
		<div class="hex"></div>
		<div class="hex"></div>
		<div class="hex"></div>
		<div class="hex"></div>
	</div>
	<div class="hex-row">
		<div class="hex"></div>
		<div class="hex"></div>
		<div class="hex"></div>
		<div class="hex"></div>
		<div class="hex"></div>
	</div>
	<div class="hex-row">
		<div class="hex"></div>
		<div class="hex"></div>
		<div class="hex"></div>
		<div class="hex"></div>
	</div>
	<div class="hex-row">
		<div class="hex"></div>
		<div class="hex"></div>
		<div class="hex"></div>
	</div>
    </div>
</body>
</html>
