<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagon Grid</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #282c34;
            margin: 0;
            position: relative;
        }

        .hex-container {
            position: relative;
            width: 250px;
            height: 280px;
        }

        .hex {
            width: 60px;
            height: 69px;
            background-color: #61dafb;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            position: absolute;
        }

        /* Positioning Hexagons in a Larger Hexagon */
        .hex:nth-child(1)  { top: 69px; left: 95px; }  /* Center */
        
        .hex:nth-child(2)  { top: 0px; left: 95px; }  /* Top Center */
        .hex:nth-child(3)  { top: 34px; left: 47px; }  /* Upper Left */
        .hex:nth-child(4)  { top: 34px; left: 143px; } /* Upper Right */
        
        .hex:nth-child(5)  { top: 69px; left: 0px; }   /* Left */
        .hex:nth-child(6)  { top: 69px; left: 190px; } /* Right */
        
        .hex:nth-child(7)  { top: 103px; left: 47px; }  /* Lower Left */
        .hex:nth-child(8)  { top: 103px; left: 143px; } /* Lower Right */
        .hex:nth-child(9)  { top: 138px; left: 95px; }  /* Bottom Center */
        
        /* Outer Layer */
        .hex:nth-child(10) { top: -35px; left: 47px; }  /* Top Outer Left */
        .hex:nth-child(11) { top: -35px; left: 143px; } /* Top Outer Right */
        .hex:nth-child(12) { top: 34px; left: -47px; }  /* Upper Far Left */
        .hex:nth-child(13) { top: 34px; left: 238px; }  /* Upper Far Right */
        .hex:nth-child(14) { top: 103px; left: -47px; } /* Lower Far Left */
        .hex:nth-child(15) { top: 103px; left: 238px; } /* Lower Far Right */
        .hex:nth-child(16) { top: 172px; left: 47px; }  /* Bottom Outer Left */
        .hex:nth-child(17) { top: 172px; left: 143px; } /* Bottom Outer Right */
        .hex:nth-child(18) { top: 207px; left: 95px; }  /* Bottom Far Center */
        .hex:nth-child(19) { top: 69px; left: 95px; opacity: 0; } /* Invisible duplicate for centering */

    </style>
</head>
<body>
    <div class="hex-container">
        <!-- 19 Hexagons -->
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
    </div>
</body>
</html>
